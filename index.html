<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OGA Dental Clinic — 3 дизайна</title>
<style>
:root{--bar:#0c4a2f;--lime:#b6e03c;--white:#f5f8ef}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;font:15px/1.3 system-ui,sans-serif;background:#fff}
.bar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--bar);color:var(--white)}
.bar b{font-size:14px;white-space:nowrap;opacity:.85}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 16px;border-radius:99px;font-weight:600;color:var(--white);box-shadow:inset 0 0 0 1.5px #ffffff44;transition:.15s}
.tabs button:hover{box-shadow:inset 0 0 0 1.5px var(--lime)}
.tabs button[aria-selected=true]{background:var(--lime);color:var(--bar);box-shadow:none}
.tabs button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.tabs small{font-weight:500;opacity:.75;margin-left:6px}
iframe{flex:1;border:0;width:100%;background:#fff}
@media(max-width:700px){.bar b{display:none}.tabs small{display:none}}
</style></head>
<body>
<div class="bar">
  <b>OGA Dental Clinic · выберите дизайн</b>
  <div class="tabs" role="tablist" id="tabs"></div>
</div>
<iframe id="fr" title="Предпросмотр дизайна"></iframe>
<script>
const V=[["garden","1. Сад","спокойный"],["precision","2. Точность","технологичный"],["family","3. Семья","дружелюбный"]];
const tabs=document.getElementById('tabs'),fr=document.getElementById('fr');
tabs.innerHTML=V.map(([k,t,s],i)=>`<button role="tab" data-i="${i}">${t}<small>${s}</small></button>`).join('');
function open(i,push){tabs.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',i==j));
  fr.src=`variant-${i+1}-${V[i][0]}.html`;
  try{localStorage.setItem('oga-v',i)}catch(e){}
  if(push)try{history.replaceState(null,'','#'+V[i][0])}catch(e){}}
tabs.onclick=e=>{const b=e.target.closest('button');b&&open(+b.dataset.i,true)};
let s=V.findIndex(v=>location.hash=='#'+v[0]);
if(s<0){try{s=+localStorage.getItem('oga-v')||0}catch(e){s=0}}
open(s,false);
</script>
</body></html>
